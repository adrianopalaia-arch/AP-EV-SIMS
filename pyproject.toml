[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ap-evisims"
version = "3.0.0a1"
description = "AP EV/SIMS 3.0 conservative sports-betting research and screening engine"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.4,<2", "pytz>=2025.2"]

[project.scripts]
ap-evisims = "ap_evsims.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
